[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  CI = "false"
  NODE_VERSION = "20"

# Force HTTPS
[[redirects]]
  from = "http://solafide-services.com/*"
  to = "https://solafide-services.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.solafide-services.com/*"
  to = "https://solafide-services.com/:splat"
  status = 301
  force = true

# WWW to non-WWW
[[redirects]]
  from = "https://www.solafide-services.com/*"
  to = "https://solafide-services.com/:splat"
  status = 301
  force = true

# SPA fallback — must be last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security & cache headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
